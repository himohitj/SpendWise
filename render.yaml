services:
  - type: web
    name: spendwise
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: SPENDWISE_DB_URL
        sync: false
      - key: SPENDWISE_DB_USERNAME
        sync: false
      - key: SPENDWISE_DB_PASSWORD
        sync: false
